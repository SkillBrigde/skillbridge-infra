name: Infrastructure CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare development environment file
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose --env-file .env config --quiet
